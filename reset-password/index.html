<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title><span data-i18n="senhaPage.tituloSenha"></span></title>

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <link rel="stylesheet" href="reset-password.css?v=1" />
    
    <script type="module" src="reset-password.js?v=1"></script>
</head>
<body>
    <header>
        <h1>
            <span data-i18n="senhaPage.modeloGeral"></span>
        </h1>
        <div class="cabecalho">
            <nav class="cabecalho_menu">
                <a class="cabecalho_link" href='/'><span data-i18n="senhaPage.botaoInicio"></span></a>
                <a class="cabecalho_link" href='/login/'> <span data-i18n="senhaPage.botaoConta"></span></a>
            </nav>
        </div>
    </header>
    <div class="container">
        <div class="main">
            <section id="questionnaire" >
                
                <h1>
                    <span data-i18n="senhaPage.redefinirSenha"></span>
                </h1>
                
                <form id="identification-form">
                    <label for="email">
                        <span data-i18n="senhaPage.campoEmail"></span>
                    </label>
                    <input type="email" id="email" name="email" required>

                    <div id="recaptcha-container"></div>
                    
                    <button type="submit"><span data-i18n="senhaPage.botaoRedefinir"></span></button>
                </form>
                
            </section>
        </div>
    </div>
    <footer>
        <div class="rodape">
           <p class="center"> 
            <span data-i18n="senhaPage.footer"></span>
        </p>
        </div>      
    </footer>
    
    <div id="loading" class="loading-state">
        <div class="loading"></div>
    </div>        
</body>
</html>
