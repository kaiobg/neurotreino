<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title data-i18n="coachPage.tituloSite"></title>

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <link rel="stylesheet" href="coach.css?v=1" />
    
    <script type="module" src="coach.js?v=1"></script>
</head>
<body data-redirect-if-not-logged-in>
    
    <header>
        <h1>
            <span data-i18n="coachPage.bemVindo"></span>
            <span id="coach-name"></span>
        </h1>
        <div class="cabecalho">
            <nav class="cabecalho_menu">
                <button id="logout-btn"><span data-i18n="coachPage.botaoSair"></span></button>    
            </nav>
        </div>
    </header>
    
    <div class="container">
        <div class="main">
            <section id="first-access" class="display-none">
                <div class="bt-container">
                    <button id="btn-all-forms"><span data-i18n="coachPage.questionarios"></span></button>
                </div>
            </section>
            
            <section id="interface" class="display-none">
                <div class="bt-container">
                    
                    <!-- Don't change this buttons ids -->
                    <button id="btn-form-attitude"><span data-i18n="coachPage.gestao"></span></button>
                    <button id="btn-form-interpersonal_relationship"><span data-i18n="coachPage.interpessoal"></span></button>
                    <button id="btn-form-emotional_regulation"><span data-i18n="coachPage.psicologicas"></span></button>
                </div>

                <div class="charts-filter">
                    <form id="charts-filter">
                        <div>
                            <label>
                                <input type="checkbox" name="compare" value="true" id="show-general-results-option" />
                                <span data-i18n="coachPage.geral"></span>
                            </label>
                        </div>

                        <div id="compare-with-other-options" class="display-none">
                            <span data-i18n="coachPage.comparacao"></span>
    
                            <div>
                                <label>
                                    <input type="checkbox" name="criteria" value="experience" />
                                    <span data-i18n="coachPage.experiencia"></span>
                                </label>
                                <label>
                                    <input type="checkbox" name="criteria" value="gender" />
                                    <span data-i18n="coachPage.genero"></span>
                                </label>
                                <label>
                                    <input type="checkbox" name="criteria" value="modality" />
                                    <span data-i18n="coachPage.modalidade">
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="charts-container">
                    <figure class="highcharts-figure">
                        <div id="general-chart-container"></div>
                    </figure>
                    
                    <figure class="highcharts-figure">
                        <div id="attitude-chart-container"></div>
                    </figure>
                    
                    <figure class="highcharts-figure">
                        <div id="interpersonal-relationship-chart-container"></div>
                    </figure>
                    
                    <figure class="highcharts-figure">
                        <div id="emotional-regulation-chart-container"></div>
                    </figure>
                </div>
            </section>
            
        </div>
        
    </div>
    <section id="interface" >
     
        <!-- <h2 class="coach-mentoria">Melhores suas habilidades aqui:</h2> -->
        
        <div class="bt-container">
               <a class="cabecalho_link" href='/course/'><span data-i18n="coachPage.resultados"></span></a>
            <!-- <button onclick="alert(getI18nMessage('coachPage.estaFuncaoEstaraDisponivelEmBreveAguarde'))">Gestão e Decisão</button>
            <button onclick="alert(getI18nMessage('coachPage.estaFuncaoEstaraDisponivelEmBreveAguarde'))">Relação Interpessoal</button>
            <button onclick="alert(getI18nMessage('coachPage.estaFuncaoEstaraDisponivelEmBreveAguarde'))">Habilidades Psicológicas e Bem-estar</button> -->
        </div>
    </section>
    <footer>
        <div class="rodape">
            <p class="center">
                <span data-i18n="coachPage.footer"></span>
            </p>
        </div>      
    </footer>
    
    <div id="loading" class="loading-state">
        <div class="loading"></div>
    </div>
</body>    

</html>
