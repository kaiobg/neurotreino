<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title data-i18n="questionnairePage.tituloAtitude"></title>

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <link rel="stylesheet" href="../questionnaires.css?v=1" />
    
    <script type="module" src="../questionnaires.js?v=1"></script>
</head>
<body data-redirect-if-not-logged-in>

    <input type="hidden" id="current-form" value="attitude" />
    <header>
        <h1>
            <span data-i18n="questionnairePage.modeloGeral"></span>
        </h1>
    </header>
    <div class="steps">
        <hr class="steps-divisor" />
        <div class="step attitude current">
            <div class="step-circle">
                <span class="step-number" data-i18n="questionnairePage.number1"></span>
            </div>
            <span class="step-title" data-i18n="questionnairePage.tituloAtitude"></span>
        </div>
        <div class="step interpersonal-relationship next">
            <div class="step-circle">
                <span class="step-number" data-i18n="questionnairePage.number2"></span>
            </div>
            <span class="step-title" data-i18n="questionnairePage.tituloRelacao"></span>
        </div>
        <div class="step emotional-regulation next">
            <div class="step-circle">
                <span class="step-number" data-i18n="questionnairePage.number3"></span>
            </div>
            <span class="step-title" data-i18n="questionnairePage.tituloHabilidades"></span>
        </div>
    </div>

    <div class="container">
        <div class="quiz-container">
            <h1 id="form-title" class="display-none">
                <span data-i18n="questionnairePage.tituloAtitude"></span>
            </h1>
            
            <div class="progress-bar">
                <span></span>
            </div>

            <div class="questao" id="question"></div>
            
            <ul id="question-options" class="options">
                <li>
                    <button data-value="1"><span data-i18n="questionnairePage.likert1"></span></button>
                </li>
                <li>
                    <button data-value="2"><span data-i18n="questionnairePage.likert2"></span></button>
                </li>
                <li>
                    <button data-value="3"><span data-i18n="questionnairePage.likert3"></span></button>
                </li>
                <li>
                    <button data-value="4"><span data-i18n="questionnairePage.likert4"></span></button>
                </li>
                <li>
                    <button data-value="5"><span data-i18n="questionnairePage.likert5"></span></button>
                </li>
            </ul>

            <div class="bt-container">
                <div>
                    <button id="btn-previous-form" class="display-none"><span data-i18n="questionnairePage.passoAnterior"></span></button>
                    <button id="btn-previous-question" class="display-none"><span data-i18n="questionnairePage.perguntaAnterior"></span></button>
                </div>
                <div>
                    <button id="btn-next-question" disabled><span data-i18n="questionnairePage.proximaPergunta"></span></button>
                    <button id="btn-end-form" disabled class="display-none"><span data-i18n="questionnairePage.enviar"></span></button>
                </div>
            </div> 
        </div>
    </div>
    <footer>
        <p class="center">
            <span data-i18n="questionnairePage.footer"></span>
        </p>
    </footer>

    <div id="loading" class="loading-state">
        <div class="loading"></div>
    </div>
</body>
</html>
