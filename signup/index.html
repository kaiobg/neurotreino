<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title data-i18n="registerPage.tituloRegister"></title>

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <link rel="stylesheet" href="signup.css?v=1" />
    
    <script type="module" src="signup.js?v=1"></script>
</head>
<body>
    <header>
        <h1>
            <span data-i18n="registerPage.modeloGeral"></span>
        </h1>
        <div class="cabecalho">
            <nav class="cabecalho_menu">
                <a class="cabecalho_link" href='/'>
                    <span data-i18n="registerPage.botaoInicio"></span>
                </a>
                <!-- <a class="cabecalho_link" href="/">Voltar</a> -->
                <a class="cabecalho_link" href='/login/'>
                    <span data-i18n="registerPage.botaoConta"></span>
                </a>
            </nav>
        </div>

        
    </header>
    
    <div class="container">
        <div class="main">   
            <section id="questionnaire" >  
                <h1 class="center">
                    <span data-i18n="registernPage.tituloCabecalho"></span>
                </h1>
                <form id="identification-form" >
                    <label for="name">
                        <span data-i18n="registerPage.campoNome"></span>
                    </label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="age">
                        <span data-i18n="registerPage.campoIdade"></span>
                    </label>
                    <input type="number" id="age" name="age" required>
                    
                    <label for="age">
                        <span data-i18n="registerPage.campoNascimento"></span>
                    </label>
                    <input type="date" id="birth" name="birth" required>
                     
                    <label for="cpf">
                        <span data-i18n="registerPage.campoId"></span>
                    </label>
                    <input type="text" id="cpf" name="cpf" required>

                    <label for="gender">
                        <span data-i18n="registerPage.campoGender"></span>
                    </label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected data-i18n="registerPage.campoSelect"></option>
                        <option value="masculino" data-i18n="registerPage.campoMale"></option>
                        <option value="feminino" data-i18n="registerPage.campoFemale"></option>
                        <option value="outro" data-i18n="registerPage.campoOther"></option>
                        <option value="nao-falx" data-i18n="registerPage.campoNoComment"></option>
                    </select>
                    
                    <label for="modality"><span data-i18n="registerPage.campoSport"></span></label>
                    <select id="modality" name="modality" required>
                        <option value="" disabled selected data-i18n="registerPage.campoSelect"></option>
                        <option value="Atletismo" data-i18n="registerPage.atletismo"></option>
                        <option value="Badminton" data-i18n="registerPage.badminton"></option>
                        <option value="Basquete" data-i18n="registerPage.basquete"></option>
                        <option value="Beach" data-i18n="registerPage.beach"></option>
                        <option value="Cricket" data-i18n="registerPage.cricket"></option>
                        <option value="Esgrima" data-i18n="registerPage.esgrima"></option>
                        <option value="Sports" data-i18n="registerPage.eletronic"></option>
                        <option value="Fitness" data-i18n="registerPage.fitness"></option>
                        <option value="Futebol" data-i18n="registerPage.futebol"></option>
                        <option value="Futebol5" data-i18n="registerPage.fut5"></option>
                        <option value="Futsal" data-i18n="registerPage.futsal"></option>
                        <option value="Ginástica" data-i18n="registerPage.ginastica"></option>
                        <option value="Goalball" data-i18n="registerPage.goalball"></option>
                        <option value="Handebol" data-i18n="registerPage.handebol"></option>
                        <option value="Lutas" data-i18n="registerPage.lutas"></option>
                        <option value="Nado" data-i18n="registerPage.natação"></option>
                        <option value="Rugby" data-i18n="registerPage.rugby"></option>
                        <option value="Surfe" data-i18n="registerPage.surfe"></option>
                        <option value="Skate" data-i18n="registerPage.skate"></option>
                        <option value="Tenis" data-i18n="registerPage.tenis"></option>
                        <option value="Mesa" data-i18n="registerPage.tenisMesa"></option>
                        <option value="volei" data-i18n="registerPage.volei"></option>
                        <option value="praia" data-i18n="registerPage.voleiPraia"></option>
                        <option value="Xadrez" data-i18n="registerPage.xadrez"></option>
                        <option value="outros" data-i18n="registerPage.outraModalidade"></option>
                    </select>

                    <label for="other-modality" id="other-modality-label" class="display-none"><span data-i18n="registerPage.qual"></span></label>
                    <input type="text" name="other-modality" id="other-modality-input" class="display-none" />
                    
                    <label for="experience"><span data-i18n="registerPage.campoExperiencia"></span></label>
                    <select id="experience" name="experience" required>
                        <option value="" disabled selected data-i18n="registerPage.campoSelect"></option>
                        <option value="1" data-i18n="registerPage.campoExperiencia1"></option>
                        <option value="1-3" data-i18n="registerPage.campoExperiencia2"></option>
                        <option value="3-5" data-i18n="registerPage.campoExperiencia3"></option>
                        <option value="5-10" data-i18n="registerPage.campoExperiencia4"></option>
                        <option value="10-15" data-i18n="registerPage.campoExperiencia5"></option>
                        <option value="15" data-i18n="registerPage.campoExperiencia6"></option>
                        
                    </select>
                    
                    <label for="formation"><span data-i18n="registerPage.campoFormacao"></span></label>
                    <select id="formation" name="formation" required>
                        <option value="" disabled selected data-i18n="registerPage.campoSelect"></option>
                        <option value="em" data-i18n="registerPage.campoFormacao1"></option>
                        <option value="gradc" data-i18n="registerPage.campoFormacao2"></option>
                        <option value="gradin" data-i18n="registerPage.campoFormacao3"></option>
                        <option value="gradoutra" data-i18n="registerPage.campoFormacao4">></option>
                        <option value="esp" data-i18n="registerPage.campoFormacao5"></option>
                        <option value="mest"  data-i18n="registerPage.campoFormacao6"></option>
                        <option value="doc" data-i18n="registerPage.campoFormacao7"></option>
                        
                    </select>
                    
                    <label for="income"><span data-i18n="registerPage.campoRenda"></span></label>
                    <select id="income" name="income" required>
                        <option value="" disabled selected><span data-i18n="registerPage.campoSelect"></option>
                        <option value="umsm" data-i18n="registerPage.campoRenda1"></option>
                        <option value="doissm" data-i18n="registerPage.campoRenda2"></option>
                        <option value="tressm" data-i18n="registerPage.campoRenda3"></option>
                        <option value="cincosm" data-i18n="registerPage.campoRenda4"></option>
                        <option value="6sm" data-i18n="registerPage.campoRenda5"></option>
                    </select>

                    <label for="email"><span data-i18n="registerPage.campoEmail"></span></label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="password"><span data-i18n="registerPage.campoSenha"></span></label>
                    <input type="password" id="senha" name="password"  data-i18n="registerPage.placeholderSenha" minlength="6" required>
                    
                    <label for="password"><span data-i18n="registerPage.campoConfirm"></span></label>
                    <input type="password" id="confirmpassword" name="confirmpassword"  data-i18n="registerPage.placeholderSenhaNovamente" minlength="6" required>
                    
                    
                    <label style="display: flex; margin-top: 20px; gap: 20px">
                        <input type="checkbox" id="tcle" name="tcle" required> 
                        <span>
                            <a data-i18n="registerPage.linkTCLE" style="padding-left: 10px;" target="_blank">
                                 <span data-i18n="registerPage.textoTCLE"></span>
                            </a>
                        </span>
                        
                        
                        <!-- <span>Li e aceito os <a href="../imgs/TCLE.pdf" style="padding-left: 10px;" target="_blank"> termos de ética</a></span> -->
                    </label>
                    
                    
                    <button type="submit"><span data-i18n="registerPage.campoEnviar"></span></button>
                </form>
                
                
            </section>
        </div>
    </div>
    <footer>
        <p class="center">
            <span data-i18n="registerPage.footer"></span>
        </p>
    </footer>

    <div id="loading" class="loading-state">
        <div class="loading"></div>
    </div>
    
</body>

</html>
