<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title data-i18n="registerPage.tituloRegister"></title>

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <link rel="stylesheet" href="signup.css?v=1" />
    
    <script type="module" src="signup.js?v=1"></script>
</head>
<body>
    <header>
        <h1>
            <span data-i18n="registerPage.modeloGeral"></span>
        </h1>
        <div class="cabecalho">
            <nav class="cabecalho_menu">
                <a class="cabecalho_link" href='/'>
                    <span data-i18n="registerPage.botaoInicio"></span>
                </a>
                <!-- <a class="cabecalho_link" href="/">Voltar</a> -->
                <a class="cabecalho_link" href='/login/'>
                    <span data-i18n="registerPage.botaoConta"></span>
                </a>
            </nav>
        </div>

        
    </header>
    
    <div class="container">
        <div class="main">   
            <section id="questionnaire" >  
                <h1 class="center">
                    <span data-i18n="registernPage.tituloCabecalho"></span>
                </h1>
                <form id="identification-form" >
                    <label for="name">
                        <span data-i18n="registerPage.campoNome"></span>
                    </label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="age">
                        <span data-i18n="registerPage.campoIdade"></span>
                    </label>
                    <input type="number" id="age" name="age" required>
                    
                    <label for="age">
                        <span data-i18n="registerPage.campoNascimento"></span>
                    </label>
                    <input type="date" id="birth" name="birth" required>
                     
                    <label for="cpf">
                        <span data-i18n="registerPage.campoId"></span>
                    </label>
                    <input type="text" id="cpf" name="cpf" required>

                    <label for="gender">
                        <span data-i18n="registerPage.campoGender"></span>
                    </label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected data-i18n="registerPage.campoSelect"></option>
                        <option value="masculino" data-i18n="registerPage.campoMale"></option>
                        <option value="feminino" data-i18n="registerPage.campoFemale"></option>
                        <option value="outro" data-i18n="registerPage.campoOther"></option>
                        <option value="nao-falx" data-i18n="registerPage.campoNoComment"></option>
                    </select>
                    
                    <label for="modality"><span data-i18n="registerPage.campoSport"></span></label>
                    <select id="modality" name="modality" required>
                        <option value="" disabled selected><span data-i18n="registerPage.campoSelect"></span></option>
                        <option value="Atletismo"><span data-i18n="registerPage.atletismo"></span></option>
                        <option value="Badminton"><span data-i18n="registerPage.badminton"></span></option>
                        <option value="Basquete"><span data-i18n="registerPage.basquete"></span></option>
                        <option value="Beach"><span data-i18n="registerPage.beach"></span></option>
                        <option value="Cricket"><span data-i18n="registerPage.cricket"></span></option>
                        <option value="Esgrima"><span data-i18n="registerPage.esgrima"></span></option>
                        <option value="Sports"><span data-i18n="registerPage.eletronic"></span></option>
                        <option value="Fitness"><span data-i18n="registerPage.fitness"></span></option>
                        <option value="Futebol"><span data-i18n="registerPage.futebol"></span></option>
                        <option value="Futebol5"><span data-i18n="registerPage.fut5"></span></option>
                        <option value="Futsal"><span data-i18n="registerPage.futsal"></span></option>
                        <option value="Ginástica"><span data-i18n="registerPage.ginastica"></span></option>
                        <option value="Goalball"><span data-i18n="registerPage.goalball"></span></option>
                        <option value="Handebol"><span data-i18n="registerPage.handebol"></span></option>
                        <option value="Lutas"><span data-i18n="registerPage.lutas"></span></option>
                        <option value="Nado"><span data-i18n="registerPage.natação"></span></option>
                        <option value="Rugby"><span data-i18n="registerPage.rugby"></span></option>
                        <option value="Surfe"><span data-i18n="registerPage.surfe"></span></option>
                        <option value="Skate"><span data-i18n="registerPage.skate"></span></option>
                        <option value="Tenis"><span data-i18n="registerPage.tenis"></span></option>
                        <option value="Mesa"><span data-i18n="registerPage.tenisMesa"></span></option>
                        <option value="volei"><span data-i18n="registerPage.volei"></span></option>
                        <option value="praia"><span data-i18n="registerPage.voleiPraia"></span></option>
                        <option value="Xadrez"><span data-i18n="registerPage.xadrez"></span></option>
                        <option value="outros"><span data-i18n="registerPage.outraModalidade"></span></option>
                    </select>

                    <label for="other-modality" id="other-modality-label" class="display-none"><span data-i18n="registerPage.qual"></span></label>
                    <input type="text" name="other-modality" id="other-modality-input" class="display-none" />
                    
                    <label for="experience"><span data-i18n="registerPage.campoExperiencia"></span></label>
                    <select id="experience" name="experience" required>
                        <option value="" disabled selected><span data-i18n="registerPage.campoSelect"></span></option>
                        <option value="1"><span data-i18n="registerPage.campoExperiencia1"></span></option>
                        <option value="1-3"><span data-i18n="registerPage.campoExperiencia2"></span></option>
                        <option value="3-5"><span data-i18n="registerPage.campoExperiencia3"></span></option>
                        <option value="5-10"><span data-i18n="registerPage.campoExperiencia4"></span></option>
                        <option value="10-15"><span data-i18n="registerPage.campoExperiencia5"></span></option>
                        <option value="15"><span data-i18n="registerPage.campoExperiencia6"></span></option>
                        
                    </select>
                    
                    <label for="formation"><span data-i18n="registerPage.campoFormacao"></span></label>
                    <select id="formation" name="formation" required>
                        <option value="" disabled selected><span data-i18n="registerPage.campoSelect"></span></option>
                        <option value="em"><span data-i18n="registerPage.campoFormacao1"></span></option>
                        <option value="gradc"><span data-i18n="registerPage.campoFormacao2"></span></option>
                        <option value="gradin"><span data-i18n="registerPage.campoFormacao3"></span></option>
                        <option value="gradoutra"><span data-i18n="registerPage.campoFormacao4"></span></option>
                        <option value="esp"><span data-i18n="registerPage.campoFormacao5"></span></option>
                        <option value="mest"><span data-i18n="registerPage.campoFormacao6"></span></option>
                        <option value="doc"><span data-i18n="registerPage.campoFormacao7"></span></option>
                        
                    </select>
                    
                    <label for="income"><span data-i18n="registerPage.campoRenda"></span></label>
                    <select id="income" name="income" required>
                        <option value="" disabled selected><span data-i18n="registerPage.campoSelect"></span></option>
                        <option value="umsm"><span data-i18n="registerPage.campoRenda1"></span></option>
                        <option value="doissm"><span data-i18n="registerPage.campoRenda2"></span></option>
                        <option value="tressm"><span data-i18n="registerPage.campoRenda3"></span></option>
                        <option value="cincosm"><span data-i18n="registerPage.campoRenda4"></span></option>
                        <option value="6sm"><span data-i18n="registerPage.campoRenda5"></span></option>
                    </select>

                    <label for="email"><span data-i18n="registerPage.campoEmail"></span></label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="password"><span data-i18n="registerPage.campoSenha"></span></label>
                    <input type="password" id="senha" name="password"  data-i18n="registerPage.placeholderSenha" minlength="6" required>
                    
                    <label for="password"><span data-i18n="registerPage.campoConfirm"></span></label>
                    <input type="password" id="confirmpassword" name="confirmpassword"  data-i18n="registerPage.placeholderSenhaNovamente" minlength="6" required>
                    
                    
                    <label style="display: flex; margin-top: 20px; gap: 20px">
                        <input type="checkbox" id="tcle" name="tcle" required> 
                        <span>
                            <a data-i18n="registerPage.linkTCLE" style="padding-left: 10px;" target="_blank">
                                 <span data-i18n="registerPage.textoTCLE"></span>
                            </a>
                        </span>
                        
                        
                        <!-- <span>Li e aceito os <a href="../imgs/TCLE.pdf" style="padding-left: 10px;" target="_blank"> termos de ética</a></span> -->
                    </label>
                    
                    
                    <button type="submit"><span data-i18n="registerPage.campoEnviar"></span></button>
                </form>
                
                
            </section>
        </div>
    </div>
    <footer>
        <p class="center">
            <span data-i18n="registerPage.footer"></span>
        </p>
    </footer>

    <div id="loading" class="loading-state">
        <div class="loading"></div>
    </div>
    
</body>

</html>
